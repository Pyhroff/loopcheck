[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcheck"
version = "0.5.0"
description = "Zero-instrumentation waste auditor for hand-rolled AI agent loops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
judge = [
    "groq>=0.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "groq>=0.9",
]

[project.scripts]
loopcheck = "loopcheck.cli:app"

[tool.setuptools.packages.find]
include = ["loopcheck*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
