name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,judge]"
      - name: Test
        run: pytest tests/ -v
      - name: Smoke-test the CLI against real sample traces
        run: |
          loopcheck analyze samples/wasteful_trace.json
          loopcheck compare samples/wasteful_trace.json samples/clean_trace.json
          loopcheck report samples/
