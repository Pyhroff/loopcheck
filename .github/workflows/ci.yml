name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,judge]"
      - name: Test
        run: pytest tests/ -v
      - name: Smoke-test the CLI against real sample traces
        run: |
          loopcheck analyze samples/wasteful_trace.json
          loopcheck compare samples/wasteful_trace.json samples/clean_trace.json
          loopcheck report samples/
